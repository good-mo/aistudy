main:
  push: &docker-build-multi-arch
    - runner:
        tags: cnb:arch:amd64
      services:
        - docker
      env:
        BUILD_KEY: linux-amd64 
      stages: &docker-build-stages
        - name: set IMAGE_TAG ENV
          script: |
            echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-${BUILD_KEY}"
          exports:
            info: IMAGE_TAG
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          timeout: 3600s
          script: |
              docker build -t ${IMAGE_TAG} .
        - name: docker push
          script: docker push ${IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: ${BUILD_KEY}
          
    - runner:
        tags: cnb:arch:arm64:v8
      services:
        - docker
      env:
        BUILD_KEY: linux-arm64
      stages: *docker-build-stages

    - services:
        - docker
      stages:
        - name: set IMAGE_TAG ENV
          script: |
            echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
          exports:
            info: IMAGE_TAG
        - name: await the amd64
          type: cnb:await
          options:
            key: linux-amd64
        - name: await the arm64
          type: cnb:await
          options:
            key: linux-arm64
        - name: manifest
          image: cnbcool/manifest
          settings:
            target: ${IMAGE_TAG}
            template: ${IMAGE_TAG}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: remove tag
          type: artifact:remove-tag
          options:
            name: ${CNB_REPO_NAME}
            tags:
              - latest-linux-amd64
              - latest-linux-arm64
            type: docker
            
$:
  vscode:
    - docker:
        image: docker.cnb.cool/examples/language/python-3
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls -al